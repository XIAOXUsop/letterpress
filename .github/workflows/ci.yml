name: CI

on:
  push:
    branches: [main, master, test]
  pull_request:
  workflow_dispatch:

jobs:
  full-gates:
    name: 完整门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # ⚠️ **2026-09-28 补的：这一步原先不存在，而这个 job 必然因此变红。**
      #
      # `verify:all` 的第 4 步 `npm run verify` **打在 `dist` 上**
      # （它要数页数、量 token、查响应头契约）。而这个 job 是全新 checkout，
      # `dist` 根本不存在——实测：把 `dist` 移走再跑 `verify`，**退出码 2**。
      #
      # > 也就是说：**这个 job 从加进来那天起就是红的**，而没人推过它所以没发现。
      # > 「接了线」不等于「线通了」——要问的是「它跑起来是什么结果」。
      #
      # ⚠️ **必须是 `verify:all` 自己那套 build，不能改成 `verify:base`**：
      # 后者用假 base 重建、且跑完会清空产物，产物形状与 `verify` 期望的不一致。
      - name: 先构建（verify:all 第 4 步打在产物上）
        run: npm run build

      - run: npm run verify:all

  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 类型检查要放在最前面：它最快，也最容易在重构后第一时间抓到问题。
      # 注意 @astrojs/check 与 typescript 是 devDependencies——
      # 少了它们，astro check 会弹一个交互式安装提示，在 CI 里直接卡死。
      - name: 类型检查
        run: npm run check

      # 单元测试覆盖纯逻辑：Accept 解析、slug 生成、链接图、体检规则。
      # 全部离线，不依赖网络也不依赖构建产物。
      - name: 单元测试
        run: npm test

      # 单元测试的**条数对账**。
      #
      # ⚠️ 这个脚本写了、在 `verify:all` 里、README 的贡献指南也让人跑它——
      # **但 CI 从来没调用过它**。写好的门禁没接线，和没有门禁是同一件事：
      # 实测（2026-09-22）它要守的那个数在四个表面上一起漂到了 263（实际 270），
      # 而 CI 全绿。门禁存在但没跑，比"没写"更坏——因为没人会再去补。
      #
      # 它读的是上一步 `npm test` 写出来的 `.verify/vitest-report.json`，
      # 所以必须紧跟在这一步后面；读不到就是失败，不是跳过。
      - name: 单元测试条数对账
        run: npm run verify:testcount

      # 端到端验证。这一步是补上来的——曾经 145 项单元测试全绿、
      # 构建成功、lint 通过，而所有 [[wiki-link]] 都原样留在正文里没渲染。
      # 原因（Astro 的 markdown 处理器 API 变更 + 内容层缓存）全都是静默的，
      # 纯函数测试根本够不着。
      #
      # 所以这里必须对**构建产物**断言三件事：
      #   1. [[方括号]] 在正文里真的被渲染成了链接
      #   2. 七个 agent 的真实 Accept 头得到正确分流
      #   3. 响应头契约（Vary / charset / token 提示）齐备
      - name: 端到端验证
        run: npm run verify

      # 子路径部署检查。**这条必须单独跑**——`npm run dev` 的 base 是 `/`，
      # 前缀为空，所有没加前缀的绝对路径在本地都工作正常。只有真正部署到
      # GitHub Pages 项目站（`/仓库名/`）时，整站才会一起失效。
      # 知识库体检必须通过。断链会让这一步失败——
      # 这是刻意的：一个不会失败的检查等于没有检查。
      - name: 确认构建产物完整
        run: |
          test -f dist/index.html || { echo "::error::缺少首页"; exit 1; }
          test -f dist/llms.txt || { echo "::error::缺少 llms.txt"; exit 1; }
          test -f dist/content-manifest.json || { echo "::error::缺少内容清单"; exit 1; }
          test -f dist/rss.xml || { echo "::error::缺少 RSS"; exit 1; }
          test -f dist/markdown-for-agents.md || { echo "::error::缺少 .md 孪生文件"; exit 1; }
          echo "产物完整：$(find dist -type f | wc -l) 个文件"

      # 搜索可用性：页面语言、索引语言、索引覆盖面。
      # `<html lang>` 决定 Pagefind 选哪个分词器——丢掉它，中文搜索会静默退回
      # 不切分中文的模式：文章还在，只是再也搜不到。排在这里是因为上一步刚确认
      # 过产物完整，而 verify:base 会 `rm -rf dist` 重建。
      - name: 搜索可用性检查
        run: npm run verify:search

      # 「可复现」不能只写在文章里。在两个时区做完整干净构建，
      # 连 Pagefind 索引一起逐文件比较 SHA-256；时间、时区或随机顺序都会让它失败。
      - name: 可复现构建检查
        run: npm run verify:reproducible

      - name: 子路径部署检查
        run: npm run verify:base

      # 内容发布探针：Markdown / MDX、草稿隔离、系统路由冲突，同样打在真实构建上。
      # 注意它和 verify:base 都会 `rm -rf dist` 再重建、并在结束时把产物清掉，
      # 所以**必须排在「确认构建产物完整」之后**——否则那一步会误报"缺少首页"。
      - name: 内容发布探针
        run: npm run verify:formats

      # 零配置必须能构建成功——这是对使用者的核心承诺（README「30 秒开始」）。
      #
      # ⚠️ **这一步此前是空的。** 它只 grep 一下 config.ts 里的 url 是不是空的，
      # 不是就打一条 `::warning::` 然后**以 0 退出**。而本仓库的 url **一直是有值的**
      # （`https://xiaoxusop.github.io/letterpress`），所以它从来没检查过任何东西；
      # 上面那些步骤跑的全是**已配置**的 config。也就是说"零配置能构建"这条承诺
      # 在 CI 里没有任何门禁——而步骤上的注释还写着"已经被隐含验证了"，正好说反。
      #
      # 现在真的把它清空再构建一次，并断言产物与那条用户可见的提示都在。
      - name: 确认零配置可构建
        run: |
          set -euo pipefail
          cp src/config.ts src/config.ts.bak
          trap 'mv -f src/config.ts.bak src/config.ts' EXIT

          # **清空失败必须红**，否则这一步又会静默退化成空操作——它已经那样过一次了。
          #
          # 注意分隔符用的是 `|` 不是 `#`：**`$#` 在双引号里是 shell 的特殊参数**
          # （位置参数个数，这里是 0），写 `s#...#...#` 会被 shell 先展开成 `...0...`，
          # 表达式直接变成垃圾。这不是 sed 的问题（把同样一行放进 `-f` 文件里是好的），
          # 所以换分隔符不是绕开，是修掉。别"顺手"改回 `#`。
          sed -i "s|^  url: '.*',$|  url: '',|" src/config.ts
          if ! grep -q "^  url: '',$" src/config.ts; then
            echo "::error::没能把 site.url 清空，这一步没有在测零配置"
            exit 1
          fi

          npm run build
          test -f dist/index.html || { echo "::error::零配置构建没有产出首页"; exit 1; }

          # README 写着「关于页会列出还差哪些字段」，一并断言——
          # 那句话是给使用者的承诺，不该只靠人偶尔打开看一眼
          if ! grep -q "site.url：你的域名" dist/about/index.html; then
            echo "::error::关于页没有列出未配置的字段（site.url）——README 承诺过这一条"
            exit 1
          fi

          echo "出厂配置（site.url 为空）下构建通过 ✓，关于页也列出了待填字段 ✓"

  knowledge-gates:
    name: 知识层门禁（纯计算）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # ⚠️ **补一个 2026-09-28 实测出来的缺口。**
      #
      # `verify:all` 有 33 步，而 `build` job 只显式调用了其中 7 个
      # （check / test / verify / verify:testcount / verify:search /
      #  verify:reproducible / verify:base / verify:formats）。
      # **剩下 26 道在 CI 上从来没跑过**——包括本仓库最核心的那批：
      # 检索金标、影响分析、答案可定位性、复核状态、核心可移植性、
      # 错误码与 JSON 输出契约、异构站点、迁移器、文档一致性。
      #
      # 此前有人注意到过一次（`verify:testcount` 那段注释写着
      # 「**但 CI 从来没调用过它**」）——**只补了那一条**。
      #
      # > **写好的门禁没接线，和没有门禁是同一件事。**
      # > 而「本地 33 步全绿、CI 也绿」会让人以为那些门禁在把关。
      #
      # ⚠️ **必须串行**：`verify:site-mutations` / `verify:exit-codes` /
      # `verify:json-mutations` 靠「改坏源码再还原」证明自己不是装饰，
      # **并发跑会互相踩**（这一条在 `docs/cli.md` 里有记）。
      # 这一组是**纯计算、无子进程**的门禁（13 道）。
      # 与下面那个 job 分开，是因为 **2026-09-28 那次 CI 失败无法定位**：
      # job 日志要 admin 权限才下载得到，`::error::` 只在日志里。
      # 拆成两个 job 后，**哪个红就是哪组**——这是排查手段，
      # 而分组依据（起子进程 / 用临时目录）本身也是真实的差异面。

      - name: 纯计算门禁（13 道，串行）
        run: |
          set -euo pipefail
          failed=""
          passed=0
          residual=0
          for step in \
            verify:gates \
            verify:questions \
            verify:impact \
            verify:answers \
            verify:portability \
            check:site-agnostic \
            check:exit-codes \
            check:single-source \
            verify:second-site \
            verify:second-site-real \
            check:anchors \
            check:agents-doc \
            check:onboarding-doc
          do
            printf '::group::%s\n' "$step"
            if npm run "$step"; then
              passed="$((passed + 1))"
            else
              # **不立刻退出**——一次跑完才知道还剩几道的红，
              # 而 `set -e` 会在第一道就停，剩下的就没人知道了。
              failed="$failed $step"
            fi
            printf '::endgroup::\n'
          done

          # 变异注入那几道改过源码。**确认它们还原干净了**——
          # 否则结论下在被改坏的代码上。
          residual_detail=""
          if ! git diff --quiet -- src/ scripts/; then
            residual=1
            residual_detail="$(git diff --stat -- src/ scripts/)"
            echo "::error::有门禁把源码改坏后没还原"
            echo "$residual_detail"
          fi

          # ⚠️ **结论写进 `GITHUB_STEP_SUMMARY`。**
          # 2026-09-28 实测：job 日志要 admin 权限才下载得到（匿名 403），
          # 而 `GITHUB_STEP_SUMMARY` 写进 run 页面、**权限要求低得多**。
          {
            echo '## 知识层门禁（纯计算）'
            echo
            echo "- 通过 $passed / 13"
            if [ -n "$failed" ]; then
              echo "- **失败 $(echo "$failed" | wc -w) 道**：$failed"
            else
              echo "- 失败：无"
            fi
            if [ "$residual" -ne 0 ]; then
              echo "- **源码有残留改动**："
              echo '```'
              echo "$residual_detail"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$failed" ]; then
            echo "::error::以下门禁在 CI 上是红的：$failed"
            exit 1
          fi
          if [ "$residual" -ne 0 ]; then
            echo "::error::门禁都绿了，但源码有残留改动（见上）——结论不作数"
            exit 1
          fi

  knowledge-gates-sub:
    name: 知识层门禁（子进程）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # ⚠️ **每道门禁是独立的一个 step，不是循环。**
      #
      # 2026-09-28：这个 job 连续三次红，而**我读不到原因**——
      # job 日志要 admin 权限（匿名 API 403 "Must have admin rights"），
      # `::error::` 只在日志里，`GITHUB_STEP_SUMMARY` 也不在 check-run output 里。
      # 循环写法只能告诉我「有红」，**说不出是哪一道**。
      #
      # 拆成独立 step 后，GitHub **在首个失败 step 后停止**，
      # 于是「第一个红的 step 名字」就是答案——而 step 列表**匿名可读**
      # （`/commits/<sha>/check-runs` 能读到每一步的结论）。
      #
      # 代价是「失败不提前终止、跑完才知道还剩几道红」——
      # 那个诉求由上面 `knowledge-gates`（纯计算组，仍是循环 + 聚合）承担。
      # **两组的取舍不同，是有意的。**
      #
      # ⚠️ 每个 step 内部仍必须**自己**保证还原：GitHub 在失败后不再跑后续 step，
      # 所以「跑完确认源码干净」那一段在这里**没有机会执行**——
      # 这也是为什么 `full-gates`（跑 `verify:all` 全程）不能省。

      - name: verify:retrieval-gates
        run: npm run verify:retrieval-gates
      - name: verify:review
        run: npm run verify:review
      - name: verify:site-mutations
        run: npm run verify:site-mutations
      - name: verify:exit-codes
        run: npm run verify:exit-codes
      - name: verify:json-output
        run: npm run verify:json-output
      - name: verify:json-mutations
        run: npm run verify:json-mutations
      # ⚠️ **2026-09-28：这道门禁在 Linux CI 上红，本地（Windows）绿。**
      #
      # 已排除的（都不是原因）：单独跑绿、组合跑绿、`full-gates` 的
      # `verify:all` 里也绿；`.verify/` 已被 gitignore；无 locale / 排序 /
      # 时区依赖；从 git 对象读的字节与工作区**逐字节相同**；
      # catch 里的 `e.stdout`/`e.stderr` 实测都是 string。
      #
      # 而 job 日志要 admin 权限（匿名 403），`::error::` 只在日志里，
      # `GITHUB_STEP_SUMMARY` 也不经 API 暴露——**唯一匿名可读的是 step 名**。
      # 所以把 5 条坏法拆成 5 个 step：GitHub 在首个失败后停止，
      # **第一个红的 step 名就是答案**。
      #
      # `--only N` 是为此给脚本加的参数（默认全跑，结论行也据实区分）。

      - name: verify:migrate ① 缺 id
        run: node scripts/migrate-manifest.mutations.mjs --only 1
      - name: verify:migrate ② sha256 不合法
        run: node scripts/migrate-manifest.mutations.mjs --only 2
      - name: verify:migrate ③ ID 重复
        run: node scripts/migrate-manifest.mutations.mjs --only 3
      - name: verify:migrate ④ documentCount 对不上
        run: node scripts/migrate-manifest.mutations.mjs --only 4
      - name: verify:migrate ⑤ 不认识的 v1 字段
        run: node scripts/migrate-manifest.mutations.mjs --only 5

      - name: verify:second-site-real-mutations
        run: npm run verify:second-site-real-mutations

  lint-content:
    name: 内容体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 单独跑一次体检，把报告留在日志里。
      # 构建步骤失败时信息会淹没在 vite 输出里，单独一步更好读。
      - name: 知识库体检
        run: |
          npm run build 2>&1 | tee build.log
          if grep -q "知识库体检" build.log; then
            echo "--- 体检报告 ---"
            grep -A 100 "知识库体检" build.log
          else
            echo "知识库体检通过，没有发现问题。"
          fi

  online-smoke:
    name: 线上内容协商烟测
    # 只在仓库变量 DEMO_ORIGIN 配好之后才跑：没部署就没有可测的东西。
    #
    # 未配置时这个 job 会以 `skipped` 出现（灰色），不是绿——这一点是刻意的：
    # 把一个没跑过的检查画成绿的，是这类检查最常见的失效方式。
    # 实测确认过（2026-09-19，run 35417922989）：4 个 job 里它是唯一一个 skipped，
    # 其余三个绿。此前这里的注释写的是"根本不出现"——**那是错的**，
    # 它会出现在 job 列表里，只是状态是 skipped。
    #
    # ⚠️ 但也别把 `skipped` 当成"通过"来读：它同样不告诉你任何关于内容协商的事。
    # 要让它真正跑起来，得去 Settings → Secrets and variables → Actions → Variables
    # 里配上 DEMO_ORIGIN。
    if: ${{ vars.DEMO_ORIGIN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 这个脚本只用 fetch，不需要装依赖，也不需要先构建
      - name: 线上烟测
        env:
          SITE_ORIGIN: ${{ vars.DEMO_ORIGIN }}
        run: node scripts/smoke-online.mjs

  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 无依赖的密钥扫描：不引第三方服务、不需要 token，纯 grep，跑完不到一秒。
      #
      # 为什么这个仓库需要：这个站点的**内容本身就是代码与配置**——文章里贴示例、
      # 文档里写连接串。别的仓库泄露密钥要靠代码，这里贴一段"顺手粘进来"的
      # 真实配置就够了，而博客的 diff 评审比代码松得多。
      #
      # 同族的四个 Java 仓库都有这一步，本仓库此前没有。
      #
      # ⚠️ 加新模式前先在本地跑一遍，确认不误报——文章里的示例串、
      # 文档里的占位符都可能被误伤，而一条会无缘无故变红的检查只会被关掉。
      # 也要反向验证：造一个真密钥，确认它真的会红。
      - name: 扫描密钥
        run: |
          if grep -rInE \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.astro \
            --exclude-dir=.git --exclude='*.lock' --exclude='package-lock.json' \
            "(sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|api[_-]?key[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_-]{16,})" \
            . ; then
            echo "::error::检测到疑似密钥/私钥泄露"
            exit 1
          fi
          echo "未检测到密钥/私钥泄露"
